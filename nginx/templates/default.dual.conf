# Unknown hosts (Cloudflare quick tunnel, IP). Served so preview works
# before preview.infolog.digital DNS exists.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    ssl_certificate __SSL_CERTIFICATE__;
    ssl_certificate_key __SSL_CERTIFICATE_KEY__;
    server_name _;
    include /etc/nginx/snippets/acme.conf;
    include /etc/nginx/snippets/security_headers.conf;
    include /etc/nginx/snippets/proxy_app.conf;
}

server {
    listen 80;
    server_name __PUBLIC_HOST__;
    include /etc/nginx/snippets/acme.conf;
    include /etc/nginx/snippets/security_headers.conf;
    include /etc/nginx/snippets/public_admin_redirect.conf;
    include /etc/nginx/snippets/proxy_app.conf;
}

server {
    listen 80;
    server_name __ADMIN_HOST__;
    include /etc/nginx/snippets/acme.conf;
    include /etc/nginx/snippets/security_headers.conf;
    include /etc/nginx/snippets/admin_root.conf;
    include /etc/nginx/snippets/proxy_app.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name __PUBLIC_HOST__;
    ssl_certificate __SSL_CERTIFICATE__;
    ssl_certificate_key __SSL_CERTIFICATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/snippets/security_headers.conf;
    include /etc/nginx/snippets/public_admin_redirect.conf;
    include /etc/nginx/snippets/proxy_app.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name __ADMIN_HOST__;
    ssl_certificate __SSL_CERTIFICATE__;
    ssl_certificate_key __SSL_CERTIFICATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/snippets/security_headers.conf;
    include /etc/nginx/snippets/admin_root.conf;
    include /etc/nginx/snippets/proxy_app.conf;
}
