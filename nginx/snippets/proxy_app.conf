location = /api/health {
    access_log off;
    include /etc/nginx/snippets/proxy_params;
    proxy_pass http://web:3000;
}

location /api/contact {
    limit_req zone=api burst=10 nodelay;
    include /etc/nginx/snippets/proxy_params;
    proxy_pass http://web:3000;
}

location / {
    include /etc/nginx/snippets/proxy_params;
    proxy_pass http://web:3000;
}
